default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host: localhost
  port: 5432

development:
  <<: *default
  database: crud_rails

test:
  <<: *default
  database: crud_rails_test

production:
  primary:
    <<: *default
    database: crud_rails_production

  cache:
    <<: *default
    database: crud_rails_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: crud_rails_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: crud_rails_cable
    migrations_paths: db/cable_migrate